<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>课程签到 - {{ course['name'] }}</title>
    <script src="/static/sm_bundle.js"></script>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            padding: 15px;
            margin: 0;
        }
        body.page-visible { opacity: 1; }

        .signin-container {
            width: 100%;
            max-width: 450px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        h2 { text-align: center; color: #1a1a1a; margin-top: 0; font-size: 20px; }

        .info-card { background: #f8f9fa; border-left: 5px solid #007bff; padding: 12px; margin-bottom: 20px; border-radius: 4px; }
        .info-card p { margin: 6px 0; color: #555; font-size: 14px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #444; font-size: 14px; }

        /* 手机端输入优化 */
        select, input[type="text"] {
            width: 100%; padding: 12px; border: 1px solid #ddd;
            border-radius: 8px; box-sizing: border-box;
            font-size: 16px !important; /* 核心：防止iOS点击缩放 */
        }

        #code_input_wrapper { display: none; margin-top: 15px; background: #fffbe6; padding: 10px; border-radius: 8px; border: 1px dashed #ffe58f; }

        .btn-submit {
            width: 100%; background: #007bff; color: white; border: none;
            padding: 14px; border-radius: 8px; font-size: 16px; cursor: pointer;
            font-weight: bold; transition: 0.3s;
        }
        .btn-submit:disabled { background-color: #ccc !important; }
        .btn-submit:active { transform: scale(0.98); opacity: 0.9; }

        .back-link { display: block; text-align: center; margin-top: 20px; color: #888; text-decoration: none; font-size: 14px; padding: 10px; }

        /* 弹窗适配 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; box-sizing: border-box; }
        .modal-icon { font-size: 40px; margin-bottom: 10px; }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .modal-msg { color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .modal-btn { background: #007bff; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; font-weight: bold; }

        /* 进度条适配 */
        .progress-box { background: white; padding: 20px; border-radius: 15px; width: 85%; max-width: 300px; text-align: center; }
        .progress-bar-container { width: 100%; height: 12px; background: #eee; border-radius: 6px; margin: 15px 0; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: #007bff; transition: width 0.1s; }
        #progress-text { font-size: 13px; color: #666; }
    </style>
</head>
<body>

<div class="signin-container">
    <h2>签到确认</h2>
    <div class="info-card">
        <p><strong>课程：</strong>{{ course['name'] }}</p>
        <p><strong>时间：</strong>{{ course['time'] }}</p>
        <p><strong>地点：</strong>{{ course['location'] }}</p>
    </div>

    <form id="signinForm" action="/do_signin/{{ course['id'] }}" method="POST">
        <div class="form-group">
            <label for="location">📍 确认当前地点：</label>
            <select name="location" id="location">
                % for loc in locations:
                    <option value="{{ loc }}" {{ 'selected' if loc == recommend_loc else '' }}>{{ loc }}</option>
                % end
            </select>
        </div>
        <div class="form-group">
            <input type="checkbox" id="has_code" name="has_code" onchange="toggleCodeInput()">
            <label style="display: inline; cursor: pointer;" for="has_code"> 我有签到码</label>
        </div>

        <div id="code_input_wrapper">
            <label for="signin_code">签到码：</label>
            <input type="text" name="signin_code" id="signin_code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="请输入4位数字签到码">
            <div id="error_text" class="error-msg"></div>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">立即签到</button>
        <a href="/" class="back-link">← 返回主页</a>
    </form>
</div>

<div id="confirmModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon">🤔</div>
        <div class="modal-title">确认爆破？</div>
        <div class="modal-msg">自动尝试 0000-9999，耗时较长。是否继续？</div>
        <div style="display: flex; gap: 10px;">
            <button class="modal-btn" style="background:#eee; color:#666;" onclick="closeConfirmModal()">取消</button>
            <button class="modal-btn" onclick="startCracking()">确认</button>
        </div>
    </div>
</div>

<div id="customModal" class="modal-overlay">
    <div class="modal-box">
        <div id="modalIcon" class="modal-icon"></div>
        <div id="modalTitle" class="modal-title"></div>
        <div id="modalMsg" class="modal-msg"></div>
        <button class="modal-btn" onclick="closeModal()">确 定</button>
    </div>
</div>

<div id="progressModal" class="modal-overlay">
    <div class="progress-box">
        <h3 style="margin:0; font-size:16px;">爆破中...</h3>
        <div class="progress-bar-container"><div id="progressBar" class="progress-bar-fill"></div></div>
        <div id="progress-text">已发送: 0 / 10000</div>
    </div>
</div>

<script>
    let isSuccess = false;
    window.onload = () => {
        document.body.classList.add('page-visible');
        document.getElementById('has_code').checked = true;
        toggleCodeInput();
    };

    function toggleCodeInput() {
        const cb = document.getElementById('has_code');
        document.getElementById('code_input_wrapper').style.display = cb.checked ? 'block' : 'none';
        if(cb.checked) document.getElementById('signin_code').focus();









    }


    document.getElementById('signinForm').onsubmit = function(e) {
        e.preventDefault();
        const code = document.getElementById('signin_code').value.trim();
        if(document.getElementById('has_code').checked) {
            if(!/^\d{4}$/.test(code)) { alert("请输入4位数字"); return; }
            executeSignin();
        } else {
            document.getElementById('confirmModal').style.display = 'flex';
        }
    };

    function closeConfirmModal() { document.getElementById('confirmModal').style.display = 'none'; }
    function startCracking() { closeConfirmModal(); document.getElementById('progressModal').style.display = 'flex'; executeSignin(); }

    function executeSignin() {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        fetch(document.getElementById('signinForm').action, { method: 'POST', body: new FormData(document.getElementById('signinForm')) })
            .then(res => res.json())
            .then(data => {
                document.getElementById('progressModal').style.display = 'none';
                showCustomModal(data.status, data.message);
            });
    }

    function updateProgressBar(curr, tot, txt) {
        document.getElementById('progressBar').style.width = (curr/tot*100) + '%';
        document.getElementById('progress-text').innerText = txt;
    }

    function showCustomModal(s, m) {
        isSuccess = (s === 'success');
        document.getElementById('modalIcon').innerText = s==='success'?'✅':'❌';
        document.getElementById('modalTitle').innerText = s==='success'?'签到成功':'签到失败';
        document.getElementById('modalMsg').innerText = m;
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
        if(isSuccess) {
            document.body.classList.remove('page-visible');
            setTimeout(() => location.href = "/", 400);
        } else {
            document.getElementById('customModal').style.display = 'none';
        }
    }
</script>
</body>
</html>
